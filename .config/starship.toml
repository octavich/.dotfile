palette = "noctalia"

format = """
$directory $character"""

right_format = """
 $cmd_duration
 $git_branch
"""

[character]
success_symbol = "[](bold green)"
error_symbol = "[󰫣](bold red)"

[directory]
format = "[$path](bold blue)"
truncation_length = 4
read_only = " 󰌾 "
read_only_style = "red"

[fill]
symbol = ' '
style = '#505050'

[time]
disabled = false
time_format = " %H:%M:%S"
style = "#444444"
format = '[$time]($style)'

[cmd_duration]
format = "[ $duration](yellow)"

[git_branch]
format = "[$symbol $branch]($style)(fg:overlay)"
symbol = ""

[username]
disabled = false
format = "[$user]($style)(fg:overlay)@"
show_always = true
style_root = "bg:overlay fg:iris"
style_user = "bg:overlay fg:iris"

[hostname]
ssh_only = false
format = '[$ssh_symbol](bold blue)[$hostname](bold red)'
trim_at = '.companyname.com'
disabled = false

