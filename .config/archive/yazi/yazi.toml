#:schema https://yazi-rs.github.io/schemas/yazi.json

# Ranger-like three-column layout and visibility.
[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true
linemode       = "none"

# scope.sh used an 8-column tab width and rendered previews up to 1920x1080.
[preview]
wrap          = "no"
tab_size      = 8
max_width     = 1920
max_height    = 1080
image_delay   = 0
image_filter  = "lanczos3"
image_quality = 90

# Programs from Ranger's rifle.conf.
[opener]
edit = [
	{ run = "nvim %s", block = true, desc = "Neovim", for = "unix" },
]
pdf = [
	{ run = "evince %s", orphan = true, desc = "Evince", for = "linux" },
]
image = [
	{ run = "loupe %s", orphan = true, desc = "Loupe", for = "linux" },
]
archive = [
	{ run = "file-roller %s", orphan = true, desc = "File Roller", for = "linux" },
]
media = [
	{ run = "mpv %s", orphan = true, desc = "mpv", for = "unix" },
]

[open]
prepend_rules = [
	{ mime = "application/pdf", use = "pdf" },
	{ mime = "image/*", use = "image" },
	{ url = "*.img", use = "image" },
	{ mime = "video/*", use = "media" },
	{ mime = "audio/*", use = "media" },
	{ url = "*.{zip,7z,tar,rar}", use = "archive" },
]
