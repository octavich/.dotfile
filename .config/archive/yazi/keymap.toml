#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
	{ on = "'", run = "back", desc = "Back to previous directory" },

	# Ranger bookmarks.
	{ on = [ "g", "c" ], run = "cd ~/.config", desc = "Go to ~/.config" },
	{ on = [ "g", "C" ], run = "cd ~/.dotfile", desc = "Go to ~/.dotfile" },
	{ on = [ "g", "n" ], run = "cd ~/.config/niri", desc = "Go to Niri config" },
	{ on = [ "g", "W" ], run = "cd ~/.config/waybar", desc = "Go to Waybar config" },
	{ on = [ "g", "b" ], run = "cd /mnt/bine4", desc = "Go to /mnt/bine4" },
	{ on = [ "g", "B" ], run = "cd /mnt/bine3", desc = "Go to /mnt/bine3" },
	{ on = [ "g", "r" ], run = "cd ~/.config/ranger", desc = "Go to Ranger config" },
	{ on = [ "g", "d" ], run = "cd ~/Downloads", desc = "Go to Downloads" },
	{ on = [ "g", "D" ], run = "cd ~/Documents", desc = "Go to Documents" },
	{ on = [ "g", "p" ], run = "cd ~/Pictures", desc = "Go to Pictures" },
	{ on = [ "g", "v" ], run = "cd ~/Videos", desc = "Go to Videos" },
	{ on = [ "g", "m" ], run = "cd /mnt", desc = "Go to /mnt" },
	{ on = [ "g", "M" ], run = "cd /run/media", desc = "Go to removable media" },
	{ on = [ "g", "P" ], run = "cd /mnt/bine4/others/rt4fht", desc = "Go to rt4fht" },
	{ on = [ "g", "t" ], run = "cd ~/.local/share/Trash/files", desc = "Go to Trash" },
	{ on = [ "g", "l" ], run = "cd ~/.local/share", desc = "Go to local share" },
	{ on = [ "g", "w" ], run = "cd ~/Pictures/wallpaper", desc = "Go to wallpapers" },

	# Ranger archive commands. 7-Zip replaces the missing `zip` binary.
	{ on = [ "z", "z" ], run = "shell -- 7z a -tzip archive.zip %s", desc = "Create archive.zip" },
	{ on = [ "z", "t" ], run = "shell -- tar -czvf archive.tar.gz -- %s", desc = "Create archive.tar.gz" },
	{ on = [ "z", "x" ], run = "shell -- 7z a archive.7z %s", desc = "Create archive.7z" },
	{ on = [ "p", "z" ], run = "shell -- ya pub extract --list %s", desc = "Extract here" },

	# File actions from rc.conf.
	{ on = "<Enter>", run = "plugin smart-enter", desc = "Enter directory or open file" },
	{ on = "D", run = "remove", desc = "Move selected files to Trash" },
	{ on = "F", run = "shell --orphan -- file-roller %s", desc = "Open in File Roller" },
	{ on = "X", run = "shell --block -- du -sh %s && sleep 1", desc = "Show selected size" },
	{ on = "x", run = "shell --block -- nvim %s", desc = "Edit in Neovim" },
	{ on = "Q", run = "shell --block -- %h", desc = "Execute hovered file" },
	{ on = "C", run = "sort mtime --reverse=no", desc = "Sort by modification time" },
	{ on = "P", run = "shell --orphan -- nautilus .", desc = "Open current directory in Nautilus" },
	{ on = "<C-v>", run = "escape --select", desc = "Clear all selections" },
	{ on = "Z", run = "plugin toggle-pane min-preview", desc = "Show or hide preview pane" },
	{ on = "<C-f>", run = "plugin fzf", desc = "Jump via fzf" },
	{ on = "<C-c>", run = "shell -- wl-copy --type image/jpeg < %h", desc = "Copy hovered image to clipboard" },

	# Wallpaper, theme, external launcher and drag-and-drop commands.
	{ on = "<C-w>", run = "shell -- awww img -t any --transition-step 255 --transition-fps 60 %h", desc = "Set wallpaper" },
	{ on = "W", run = "shell -- awww img -t any --transition-step 255 --transition-fps 60 %h && matugen image %h", desc = "Set wallpaper and Matugen theme" },
	{ on = "R", run = "shell -- ~/.config/matugen/color.sh %h", desc = "Run Matugen color script" },
	{ on = "<C-e>", run = "shell --orphan -- /mnt/bine4/PortProton/data/scripts/start.sh %h --and-exit", desc = "Open with PortProton" },
	{ on = "<C-d>", run = "shell --orphan -- dragon-drop -a -x %h", desc = "Drag hovered file" },
]
